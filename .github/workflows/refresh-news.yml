name: Refresh news backup

on:
  workflow_dispatch:
  schedule:
    # 08:00-19:00 Asia/Singapore, inclusive.
    - cron: '0 0-11 * * *'

permissions:
  contents: write

concurrency:
  group: news-backup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and save headline metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, email.utils, json, pathlib, re, time
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET
          path = pathlib.Path('data/news.json')
          previous = json.loads(path.read_text()) if path.exists() else {'sources': []}
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          sources = []
          for name, domain in [('CNA', 'channelnewsasia.com'), ('The Straits Times', 'straitstimes.com')]:
              old = next((s for s in previous.get('sources', []) if s['name'] == name), None)
              error = None
              for attempt in range(3):
                  try:
                      query = urllib.parse.urlencode({'q': f'site:{domain} (haze OR PM2.5 OR "air quality") when:7d', 'hl': 'en-SG', 'gl': 'SG', 'ceid': 'SG:en'})
                      request = urllib.request.Request('https://news.google.com/rss/search?' + query, headers={'User-Agent': 'SingaporeHazeTracker/1.0', 'Accept': 'application/rss+xml'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          root = ET.fromstring(response.read(2_000_000))
                      if root.tag != 'rss':
                          raise ValueError('Expected RSS')
                      items = []
                      for item in root.findall('./channel/item'):
                          publisher = item.find('source')
                          if publisher is None or urllib.parse.urlparse(publisher.get('url', '')).hostname not in [domain, 'www.' + domain]:
                              continue
                          title = item.findtext('title', '')
                          if not re.search(r'\bhaze\b|\bhazy\b|\bPM[2₂][.]?5\b|\bair quality\b', title, re.I):
                              continue
                          link = item.findtext('link', '')
                          parsed = urllib.parse.urlparse(link)
                          if parsed.scheme != 'https' or parsed.hostname != 'news.google.com':
                              continue
                          try:
                              date = email.utils.parsedate_to_datetime(item.findtext('pubDate', ''))
                              if date.tzinfo is None:
                                  continue
                          except (ValueError, TypeError):
                              continue
                          title = re.sub(r'\s+-\s+(CNA|The Straits Times|straitstimes.com)$', '', title, flags=re.I)
                          items.append({'title': title, 'url': link, 'published': date.isoformat(), 'source': name, 'via': 'Google News'})
                      items.sort(key=lambda i: datetime.datetime.fromisoformat(i['published']), reverse=True)
                      sources.append({'name': name, 'fetchedAt': now, 'available': True, 'items': items[:10]})
                      print(name, 'OK', len(items), 'matching headlines')
                      error = None
                      break
                  except Exception as exc:
                      error = type(exc).__name__
                      if attempt < 2:
                          time.sleep(5)
              if error:
                  if old:
                      sources.append({**old, 'available': False, 'error': error})
                  else:
                      sources.append({'name': name, 'available': False, 'fetchedAt': None, 'items': [], 'error': error})
                  print(name, 'fetch failed; previous timestamp preserved')
          if not any(s['available'] for s in sources):
              raise SystemExit('No sources refreshed; keeping the existing file unchanged')
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps({'schemaVersion': 1, 'checkedAt': now, 'sources': sources}, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Save backup file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh haze headline backup"
            git push
          fi
