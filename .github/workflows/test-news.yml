name: Test Google News access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test both sources three times
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, email.utils, json, os, re, time
          import urllib.request, urllib.parse, urllib.error
          import xml.etree.ElementTree as ET

          sources = [('CNA', 'channelnewsasia.com'), ('The Straits Times', 'straitstimes.com')]
          sg = datetime.timezone(datetime.timedelta(hours=8))
          results = []
          for trial in range(1, 4):
              for name, domain in sources:
                  query = {'q': f'site:{domain} (haze OR PM2.5 OR "air quality") when:7d',
                           'hl': 'en-SG', 'gl': 'SG', 'ceid': 'SG:en'}
                  url = 'https://news.google.com/rss/search?' + urllib.parse.urlencode(query)
                  row = {'trial': trial, 'source': name, 'ok': False}
                  started = time.monotonic()
                  try:
                      request = urllib.request.Request(url, headers={
                          'User-Agent': 'SingaporeHazeTracker/1.0',
                          'Accept': 'application/rss+xml, application/xml, text/xml'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          row['http_status'] = response.status
                          xml = response.read(2_000_000)
                      root = ET.fromstring(xml)
                      if root.tag != 'rss':
                          raise ValueError('Expected RSS, received another document format')
                      dates = []
                      for item in root.findall('./channel/item'):
                          publisher = item.find('source')
                          if publisher is None:
                              continue
                          host = urllib.parse.urlparse(publisher.get('url', '')).hostname
                          if host not in (domain, 'www.' + domain):
                              continue
                          title = item.findtext('title', '')
                          if not re.search(r'\bhaze\b|\bhazy\b|\bPM[2₂][.]?5\b|\bair quality\b', title, re.I):
                              continue
                          try:
                              date = email.utils.parsedate_to_datetime(item.findtext('pubDate', ''))
                              if date.tzinfo is not None:
                                  dates.append(date)
                          except (ValueError, TypeError):
                              pass
                      row['matching_articles'] = len(dates)
                      row['ok'] = len(dates) > 0
                      row['newest_sgt'] = max(dates).astimezone(sg).isoformat() if dates else None
                  except urllib.error.HTTPError as error:
                      row['http_status'] = error.code
                      row['error'] = str(error)
                  except Exception as error:
                      row['error'] = type(error).__name__ + ': ' + str(error)
                  row['elapsed_seconds'] = round(time.monotonic() - started, 2)
                  results.append(row)
                  print(json.dumps(row), flush=True)
              if trial < 3:
                  time.sleep(10)
          passed = sum(row['ok'] for row in results)
          print(f'Result: {passed}/{len(results)} successful fetches. A short test does not establish long-term reliability.')
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as report:
                  report.write('## Google News connectivity test\n\n')
                  report.write('| Trial | Source | HTTP | Matches | Newest article (Singapore time) | Result |\n')
                  report.write('| --- | --- | --- | --- | --- | --- |\n')
                  for row in results:
                      report.write(f"| {row['trial']} | {row['source']} | {row.get('http_status', 'error')} | {row.get('matching_articles', '-')} | {row.get('newest_sgt') or '-'} | {'Pass' if row['ok'] else 'Fail'} |\n")
                  report.write('\nThis workflow is manual only. It does not update the dashboard, publish article content, or enable a recurring schedule.\n')
          if passed != len(results):
              raise SystemExit(1)
          PY
